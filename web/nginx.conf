# Web 服务：Nginx 托管单页前端，并把业务 API 反代到 api 服务。
upstream api_upstream {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # 前端静态资源
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Web 健康检查：自身页面 + 经反代访问 API 健康端点
    location = /health {
        proxy_pass http://api_upstream/api/health;
        proxy_set_header Host $host;
    }

    # 业务 API 反代
    location /api/ {
        proxy_pass http://api_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
