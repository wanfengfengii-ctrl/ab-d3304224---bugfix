<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>深海观测网 · 永久故障电缆归因</title>
<style>
  :root {
    --bg: #0b1622;
    --panel: #122231;
    --panel-2: #183047;
    --line: #25445f;
    --text: #dcebf5;
    --muted: #8fb0c7;
    --accent: #37b6d9;
    --ok: #3fce8a;
    --warn: #f0b35e;
    --err: #ef6f6f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.55 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  header {
    padding: 18px 28px; border-bottom: 1px solid var(--line);
    background: linear-gradient(120deg, #0d2030, #102a3d);
  }
  header h1 { margin: 0; font-size: 20px; letter-spacing: 1px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  main { max-width: 1180px; margin: 0 auto; padding: 22px 28px 60px; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 18px 20px; margin-bottom: 20px;
  }
  .card h2 { margin: 0 0 12px; font-size: 16px; color: var(--accent); }
  .hint { color: var(--muted); font-size: 12px; margin: 2px 0 10px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 6px 8px; text-align: left; vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  input[type=text], input[type=number], select {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 6px; padding: 6px 8px; width: 100%;
  }
  input:focus, select:focus { outline: 1px solid var(--accent); }
  button {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 6px; padding: 7px 14px; cursor: pointer; font-size: 13px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: #147393; border-color: #2aa3c7; font-weight: 600; }
  button.danger { color: #ffc4c4; }
  .row-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .round-card {
    border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px;
    margin-bottom: 12px; background: var(--panel-2);
  }
  .round-card h3 { margin: 0 0 8px; font-size: 14px; display: flex; justify-content: space-between; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    background: #0f2233; border: 1px solid var(--line); border-radius: 999px;
    padding: 3px 10px; font-size: 12px;
  }
  .chip input { accent-color: var(--accent); }
  .reading-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px; margin-top: 8px; }
  .reading-grid label {
    display: flex; align-items: center; justify-content: space-between;
    background: #0f2233; border: 1px solid var(--line); border-radius: 6px;
    padding: 4px 8px; font-size: 12px;
  }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .status-pill { font-size: 12px; color: var(--muted); }
  .banner { border-radius: 8px; padding: 12px 16px; margin-bottom: 14px; font-size: 14px; }
  .banner.ok  { background: rgba(63,206,138,.12); border: 1px solid var(--ok); }
  .banner.err { background: rgba(239,111,111,.12); border: 1px solid var(--err); }
  .banner.info { background: rgba(55,182,217,.10); border: 1px solid var(--accent); }
  .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 8px; margin: 10px 0; }
  .kv div { background: var(--panel-2); border-radius: 6px; padding: 8px 12px; }
  .kv b { display: block; font-size: 18px; color: var(--accent); }
  .kv span { color: var(--muted); font-size: 12px; }
  .match-yes { color: var(--ok); }
  .match-no { color: var(--err); font-weight: 600; }
  .api-error {
    background: rgba(239,111,111,.1); border: 1px solid var(--err);
    border-radius: 8px; padding: 10px 14px; margin-bottom: 14px;
    white-space: pre-wrap; font-size: 12px;
  }
  .muted { color: var(--muted); }
  .stale-note { font-size: 12px; color: var(--warn); margin-top: 6px; }
  .del-round { padding: 2px 8px; font-size: 12px; }
  code { background: #0f2233; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1>深海观测网 · 海底电缆永久故障归因</h1>
  <p>录入网络拓扑与多轮继电器切换读数，系统将枚举全部永久故障电缆组合，逐轮校验电源可达性，按「故障数最少 → 修复风险和最低 → 录入顺序编号序列最小」择优。</p>
</header>

<main>
  <section class="card" id="editor">
    <h2>① 观测网草稿</h2>
    <p class="hint">约束：节点 5~10 个，电缆 6~14 条（修复风险 ≥ 0），试验 2~7 轮；每轮需给出全部传感器的通电/断电读数。</p>

    <h2 style="font-size:14px;margin-top:14px">节点（5~10）</h2>
    <table id="nodes-table">
      <thead><tr><th style="width:60px">序号</th><th>节点名称</th><th style="width:90px">操作</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="row-actions">
      <button type="button" id="add-node">+ 添加节点</button>
      <label class="chip" style="padding:6px 12px">唯一电源节点
        <select id="source-select" style="width:auto;margin-left:6px"></select>
      </label>
    </div>

    <h2 style="font-size:14px;margin-top:18px">电缆（6~14，按录入顺序编号）</h2>
    <table id="cables-table">
      <thead><tr>
        <th style="width:52px">#</th><th>电缆名称</th><th>端点 A</th><th>端点 B</th>
        <th style="width:130px">修复风险</th><th style="width:90px">操作</th>
      </tr></thead>
      <tbody></tbody>
    </table>
    <div class="row-actions"><button type="button" id="add-cable">+ 添加电缆</button></div>

    <h2 style="font-size:14px;margin-top:18px">继电器切换试验（2~7 轮）</h2>
    <div id="rounds"></div>
    <div class="row-actions"><button type="button" id="add-round">+ 添加试验轮次</button></div>

    <div class="row-actions" style="margin-top:18px">
      <button type="button" class="primary" id="btn-diagnose">保存草稿并发起归因</button>
      <button type="button" id="btn-sample">填充示例数据</button>
      <span class="status-pill" id="draft-status">尚未保存草稿</span>
    </div>
    <div class="stale-note" id="stale-note" hidden>草稿已修改：发起归因后旧结论将被废弃，不会保留历史结论。</div>
    <div id="api-error"></div>
  </section>

  <section class="card" id="result-card" hidden>
    <h2>② 归因结论</h2>
    <div id="banner"></div>
    <div id="summary"></div>
    <div id="faults"></div>
    <div id="round-results"></div>
  </section>
</main>

<script>
"use strict";

const LIMITS = { nodes: [5, 10], cables: [6, 14], rounds: [2, 7] };

const state = {
  nodes: [],            // string[]
  cables: [],           // {name, u, v, repair_risk}
  rounds: [],           // {closed: Set<string> (as array), readings: {node: bool}}
  draftId: null,
  revision: 0,
  dirty: false,
};

// ---------- 渲染 ----------
function $(sel) { return document.querySelector(sel); }

function renderNodes() {
  const tb = $("#nodes-table tbody");
  tb.innerHTML = "";
  state.nodes.forEach((name, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="muted">${i + 1}</td>
      <td><input type="text" data-i="${i}" value="${escapeAttr(name)}" placeholder="如 N1 / SENSOR-A" /></td>
      <td><button type="button" class="danger" data-del="${i}">删除</button></td>`;
    tb.appendChild(tr);
  });
  tb.oninput = (e) => {
    const i = e.target.dataset.i;
    if (i !== undefined) { state.nodes[+i] = e.target.value; markDirty(); renderNodeSelects(); }
  };
  tb.onclick = (e) => {
    if (e.target.dataset.del !== undefined) {
      state.nodes.splice(+e.target.dataset.del, 1);
      markDirty(); renderAll();
    }
  };
  renderNodeSelects();
}

function renderNodeSelects() {
  const opts = state.nodes.map((n, i) => `<option value="${escapeAttr(n)}">${escapeHtml(n) || "(空名)"}</option>`).join("");
  const src = $("#source-select");
  const prev = src.value;
  src.innerHTML = opts;
  if (state.nodes.includes(prev)) src.value = prev;
  state.cables.forEach((c, i) => {
    for (const side of ["u", "v"]) {
      const sel = document.querySelector(`#cables-table select[data-i="${i}"][data-side="${side}"]`);
      if (sel) {
        const p = sel.value;
        sel.innerHTML = opts;
        sel.value = state.nodes.includes(p) ? p : c[side];
      }
    }
  });
}

function renderCables() {
  const tb = $("#cables-table tbody");
  tb.innerHTML = "";
  const opts = state.nodes.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n) || "(空名)"}</option>`).join("");
  state.cables.forEach((c, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="muted">${i + 1}</td>
      <td><input type="text" data-k="name" data-i="${i}" value="${escapeAttr(c.name)}" placeholder="如 C1" /></td>
      <td><select data-k="u" data-side="u" data-i="${i}">${opts}</select></td>
      <td><select data-k="v" data-side="v" data-i="${i}">${opts}</select></td>
      <td><input type="number" min="0" step="0.1" data-k="repair_risk" data-i="${i}" value="${c.repair_risk}" /></td>
      <td><button type="button" class="danger" data-del="${i}">删除</button></td>`;
    tb.appendChild(tr);
    tr.querySelector(`[data-side=u]`).value = c.u;
    tr.querySelector(`[data-side=v]`).value = c.v;
  });
  tb.oninput = (e) => {
    const i = e.target.dataset.i, k = e.target.dataset.k;
    if (i !== undefined && k) {
      state.cables[+i][k] = (k === "repair_risk") ? Number(e.target.value) : e.target.value;
      markDirty();
      if (k === "name") renderRounds();
    }
  };
  tb.onchange = (e) => {
    const i = e.target.dataset.i, k = e.target.dataset.k;
    if (i !== undefined && (k === "u" || k === "v")) { state.cables[+i][k] = e.target.value; markDirty(); }
  };
  tb.onclick = (e) => {
    if (e.target.dataset.del !== undefined) {
      state.cables.splice(+e.target.dataset.del, 1);
      markDirty(); renderAll();
    }
  };
}

function renderRounds() {
  const box = $("#rounds");
  box.innerHTML = "";
  state.rounds.forEach((r, ri) => {
    const card = document.createElement("div");
    card.className = "round-card";
    const cableChips = state.cables.map(c => `
      <span class="chip"><input type="checkbox" id="cl-${ri}-${escapeAttr(c.name)}"
        ${r.closed.includes(c.name) ? "checked" : ""} data-r="${ri}" data-cable="${escapeAttr(c.name)}"/>
        <label for="cl-${ri}-${escapeAttr(c.name)}">${escapeHtml(c.name) || "(未命名)"}</label></span>`).join("");
    const readings = state.nodes.map(n => `
      <label>${escapeHtml(n) || "(空名)"}
        <select data-reading="${ri}" data-node="${escapeAttr(n)}">
          <option value="1" ${r.readings[n] === true ? "selected" : ""}>通电</option>
          <option value="0" ${r.readings[n] === false ? "selected" : ""}>断电</option>
        </select></label>`).join("");
    card.innerHTML = `
      <h3><span>第 ${ri + 1} 轮</span>
        <button type="button" class="danger del-round" data-del-round="${ri}">删除本轮</button></h3>
      <div class="muted" style="font-size:12px">闭合的电缆（继电器吸合）：</div>
      <div class="chips" style="margin:4px 0 8px">${cableChips || '<span class="muted">（尚无电缆）</span>'}</div>
      <div class="muted" style="font-size:12px">传感器读数：</div>
      <div class="reading-grid">${readings}</div>`;
    box.appendChild(card);
  });
  box.onchange = (e) => {
    const ri = e.target.dataset.r;
    if (ri !== undefined) {
      const name = e.target.dataset.cable;
      const set = new Set(state.rounds[+ri].closed);
      e.target.checked ? set.add(name) : set.delete(name);
      state.rounds[+ri].closed = [...set];
      markDirty();
      return;
    }
    if (e.target.dataset.reading !== undefined) {
      const i = +e.target.dataset.reading, node = e.target.dataset.node;
      state.rounds[i].readings[node] = e.target.value === "1";
      markDirty();
    }
  };
  box.onclick = (e) => {
    if (e.target.dataset.delRound !== undefined) {
      state.rounds.splice(+e.target.dataset.delRound, 1);
      markDirty(); renderRounds();
    }
  };
}

function renderAll() { renderNodes(); renderCables(); renderRounds(); }

function markDirty() {
  state.dirty = true;
  $("#stale-note").hidden = false;
  if (state.draftId) $("#draft-status").textContent = `草稿 ${state.draftId}（有未保存修改）`;
}

// ---------- 收集与校验 ----------
function collectPayload() {
  const nodes = state.nodes.map(s => s.trim());
  const cableNames = new Set(state.cables.map(c => c.name.trim()));
  return {
    name: "Web 录入草稿",
    nodes,
    source: $("#source-select").value,
    cables: state.cables.map(c => ({
      name: c.name.trim(), u: c.u, v: c.v, repair_risk: Number(c.repair_risk) || 0,
    })),
    rounds: state.rounds.map(r => ({
      closed: r.closed.filter(n => cableNames.has(n)),
      readings: Object.fromEntries(nodes.map(n => [n, r.readings[n] === true])),
    })),
  };
}

function showError(detail) {
  const box = $("#api-error");
  if (!detail) { box.innerHTML = ""; box.hidden = true; return; }
  let text;
  try {
    const arr = typeof detail === "string" ? JSON.parse(detail) : detail;
    if (Array.isArray(arr)) text = arr.map(x => `• ${x.loc ? x.loc.join(" → ") + "：" : ""}${x.msg}`).join("\n");
    else text = JSON.stringify(detail, null, 2);
  } catch { text = String(detail); }
  box.className = "api-error";
  box.textContent = "请求未通过校验：\n" + text;
  box.hidden = false;
}

// ---------- API 调用 ----------
async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { showError(data.detail || res.statusText); throw new Error(res.statusText); }
  showError(null);
  return data;
}

async function saveAndDiagnose() {
  const payload = collectPayload();
  let rec;
  if (!state.draftId) {
    rec = await api("POST", "/api/drafts", payload);
  } else if (state.dirty) {
    rec = await api("PUT", `/api/drafts/${state.draftId}`, payload);
  }
  if (rec) {
    state.draftId = rec.id;
    state.revision = rec.revision;
  }
  state.dirty = false;
  $("#stale-note").hidden = true;
  $("#draft-status").textContent =
    `草稿 ${state.draftId} · 修订版本 r${state.revision}（旧结论已随改稿清除）`;
  const result = await api("POST", `/api/drafts/${state.draftId}/diagnose`);
  renderResult(result);
}

// ---------- 结果展示 ----------
function renderResult(d) {
  $("#result-card").hidden = false;
  $("#banner").innerHTML = d.feasible
    ? `<div class="banner ok">✓ ${escapeHtml(d.message)}</div>`
    : `<div class="banner err">✗ ${escapeHtml(d.message)}<br/>
       <span class="muted" style="font-size:12px">请返回上方修改草稿（调整读数、闭合电缆或拓扑）后重新发起归因；改稿不会保留本次结论。</span></div>`;

  $("#summary").innerHTML = `
    <div class="kv">
      <div><b>${d.fault_count}</b><span>永久故障电缆数量</span></div>
      <div><b>${d.total_repair_risk}</b><span>修复风险总和</span></div>
      <div><b>${d.candidate_count}</b><span>与全部读数吻合的可行组合数</span></div>
      <div><b>r${d.revision}</b><span>归因所基于的草稿修订版本</span></div>
    </div>`;

  $("#faults").innerHTML = d.feasible ? `
    <h2 style="font-size:14px">判定为长期失效的电缆（按录入顺序）</h2>
    <div class="chips">${
      d.fault_cables.length
        ? d.fault_cables.map(f => `<span class="chip">#${f.seq} <code>${escapeHtml(f.name)}</code></span>`).join("")
        : '<span class="chip">无（零故障即可解释全部读数）</span>'
    }</div>` : "";

  $("#round-results").innerHTML = `<h2 style="font-size:14px;margin-top:18px">逐轮可达性与读数比对</h2>` +
    d.rounds.map(rc => {
      const rows = rc.readings.expected_powered.map(n => {
        const reach = rc.reachable.includes(n);
        return `<tr><td><code>${escapeHtml(n)}</code></td>
          <td class="match-yes">通电</td>
          <td class="${reach ? "match-yes" : "match-no"}">${reach ? "可达" : "不可达"}</td>
          <td class="${reach ? "match-yes" : "match-no"}">${reach ? "✓ 吻合" : "✗ 应通电却失电"}</td></tr>`;
      }).join("") + rc.readings.expected_unpowered.map(n => {
        const reach = rc.reachable.includes(n);
        return `<tr><td><code>${escapeHtml(n)}</code></td>
          <td class="muted">断电</td>
          <td class="${reach ? "match-no" : "match-yes"}">${reach ? "可达" : "不可达"}</td>
          <td class="${reach ? "match-no" : "match-yes"}">${reach ? "✗ 应断电却带电" : "✓ 吻合"}</td></tr>`;
      }).join("");
      return `<div class="round-card">
        <h3><span>第 ${rc.round} 轮</span>
          <span class="${rc.matches ? "match-yes" : "match-no"}">${rc.matches ? "全部吻合" : "存在读数冲突"}</span></h3>
        <div class="muted" style="font-size:12px">闭合电缆：</div>
        <div class="chips" style="margin:4px 0 8px">${
          rc.closed.map(c => `<span class="chip">${escapeHtml(c)}</span>`).join("") || '<span class="muted">（无）</span>'}</div>
        <div class="muted" style="font-size:12px">电源可达传感器：</div>
        <div class="chips" style="margin:4px 0 8px">${
          rc.reachable.map(n => `<span class="chip">${escapeHtml(n)}</span>`).join("") || '<span class="muted">（仅电源或全部不可达）</span>'}</div>
        <table><thead><tr><th>节点</th><th>录入读数</th><th>实际可达性</th><th>比对</th></tr></thead><tbody>${rows}</tbody></table>
      </div>`;
    }).join("");

  $("#result-card").scrollIntoView({ behavior: "smooth" });
}

// ---------- 工具 ----------
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, ch =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}
function escapeAttr(s) { return escapeHtml(s); }

// ---------- 初始化 ----------
function addNode(name) {
  state.nodes.push(name ?? `N${state.nodes.length + 1}`);
  const i = state.nodes.length - 1;
  state.rounds.forEach(r => { r.readings[state.nodes[i]] = false; });
  renderAll();
  markDirty();
}
function addCable() {
  const i = state.cables.length + 1;
  state.cables.push({
    name: `C${i}`,
    u: state.nodes[0] || "", v: state.nodes[1] || state.nodes[0] || "",
    repair_risk: 1,
  });
  renderAll();
  markDirty();
}
function addRound() {
  state.rounds.push({
    closed: state.cables.map(c => c.name),
    readings: Object.fromEntries(state.nodes.map(n => [n, false])),
  });
  renderRounds();
  markDirty();
}

$("#add-node").onclick = () => addNode();
$("#add-cable").onclick = addCable;
$("#add-round").onclick = addRound;
$("#btn-diagnose").onclick = () => saveAndDiagnose().catch(() => {});

$("#btn-sample").onclick = () => {
  // 5 节点环网 + 1 条跨接电缆，共 6 条。
  // 第 1 轮仅闭合路径 SRC-A-B-C：读数 C 断电，逼出路径上恰有一处永久故障；
  //   A、B 仍通电 => 只能是 C3（B-C）永久故障。
  // 第 2 轮全部闭合：C3 虽永久故障，环网另一侧与跨接电缆 C6 形成替代通路，
  //   全网通电 —— 正是不能只凭单轮读数局部判断的原因。
  state.nodes = ["SRC", "A", "B", "C", "D"];
  state.cables = [
    { name: "C1", u: "SRC", v: "A", repair_risk: 3 },
    { name: "C2", u: "A", v: "B", repair_risk: 2 },
    { name: "C3", u: "B", v: "C", repair_risk: 1 },
    { name: "C4", u: "C", v: "D", repair_risk: 4 },

    { name: "C6", u: "SRC", v: "B", repair_risk: 2 },
  ];
  state.rounds = [
    { closed: ["C1", "C2", "C3"],
      readings: { SRC: true, A: true, B: true, C: false, D: false } },
    { closed: ["C1", "C2", "C3", "C4", "C5", "C6"],
      readings: { SRC: true, A: true, B: true, C: true, D: true } },
  ];
  state.draftId = null; state.dirty = true;
  renderAll();

};
